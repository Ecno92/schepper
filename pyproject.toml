[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schepper"
version = "0.1.0"
description = "Declarative manager for Docker Sandboxes (sbx)"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.11"
keywords = ["docker", "sbx", "sandbox", "devtools", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Ecno92/schepper"
Issues = "https://github.com/Ecno92/schepper/issues"

[project.scripts]
schepper = "schepper:main"

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*isolated_filesystem.*:DeprecationWarning"]
